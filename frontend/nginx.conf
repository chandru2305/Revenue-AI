server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy the API and health check to the backend service so the
    # browser only ever talks to this origin. Keeps CORS out of the picture
    # for the container setup.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }

    # SPA fallback — every other path resolves to the built index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
