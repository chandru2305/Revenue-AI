name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check app tests alembic scripts
      - run: python -m mypy app scripts
      - run: python -m pytest -q
        env:
          DATABASE_URL: sqlite+aiosqlite:///./ci.db

  # The test suite builds its schema with Base.metadata.create_all, so it
  # would pass even if the Alembic migrations were broken or had drifted
  # from the models. This job is the only thing that actually exercises
  # them — and against PostgreSQL, the real target, not SQLite.
  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recoverai
          POSTGRES_PASSWORD: recoverai
          POSTGRES_DB: recoverai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recoverai -d recoverai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://recoverai:recoverai@localhost:5432/recoverai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply to a fresh database
        run: python -m alembic upgrade head
      - name: Models and migrations have not drifted
        # Fails if a model change was made without a matching migration —
        # the failure mode the test suite structurally cannot catch.
        run: python -m alembic check
      - name: Migrations are reversible
        run: |
          python -m alembic downgrade base
          python -m alembic upgrade head

  evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r evaluation/requirements-dev.txt
      - run: python -m ruff check evaluation --config evaluation/pyproject.toml
      - run: python -m pytest evaluation/tests -q
      - run: python -m evaluation.generate_dataset --count 500 --seed 42
      - run: python -m evaluation.run_evaluation --dataset evaluation/datasets/generated/dataset_500_seed42.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc -b
      - run: npx oxlint
      - run: npm run build
